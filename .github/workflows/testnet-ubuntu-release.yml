name: testnet/release-tarballs

on:
  push:
    tags:
      - "testnet-ubuntu-v*"

env:
  FREE_DISKSPACE: |
    sudo rm -rf /usr/local/.ghcup /usr/share/dotnet /usr/share/swift /usr/share/miniconda

# Both jobs run on the same tag push. The Ubuntu job creates the GitHub release;
# the Windows job uploads into it. They have no build dependency on each other
# and run in parallel, so we make the Windows upload resilient to a missing
# release (it will retry until the Ubuntu job has created it).
jobs:
  ubuntu-testnet-tarball:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install runtime test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxcb-shape0 libxkbcommon-x11-0

      - name: Free disk space
        run: ${{ env.FREE_DISKSPACE }}

      - name: Prepare build container
        run: docker build --tag monero-gui-testnet-build --build-arg THREADS=3 --file Dockerfile.linux .

      - name: Build static Ubuntu binaries
        run: docker run --rm -e CMAKE_BUILD_PARALLEL_LEVEL=1 -v "${GITHUB_WORKSPACE}:/monero-gui" -w /monero-gui monero-gui-testnet-build sh -c 'scripts/sync-testnet-monero.sh && make release-static MANUAL_SUBMODULES=ON'

      - name: Smoke test QML
        run: xvfb-run -a build/release/bin/monero-wallet-gui --test-qml

      - name: Package tarball
        id: package
        run: |
          version="${GITHUB_REF_NAME:-manual}"
          if [ "${GITHUB_REF_TYPE:-}" == "tag" ]; then
            # Strip the redundant "testnet-ubuntu-v" tag prefix so the tarball
            # name doesn't repeat it (e.g. tag "testnet-ubuntu-v0.19.0.0-beta.2.0"
            # -> version "0.19.0.0-beta.2.0").
            version="${version#testnet-ubuntu-v}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          tarball="$(scripts/package-testnet-ubuntu.sh build/release/bin "${version}" dist)"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: monero-gui-testnet-ubuntu-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --title "Monero GUI Testnet ${GITHUB_REF_NAME}" \
            --notes "Monero GUI testnet-only build.

          - Linux x86_64: monero-gui-${{ steps.package.outputs.version }}-linux-x86_64.tar.gz (extract and run ./start-testnet.sh)
          - Windows x64:  monero-gui-${{ steps.package.outputs.version }}-windows-x64.zip (extract and run start-testnet.bat)"

  windows-testnet-zip:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Free disk space
        run: ${{ env.FREE_DISKSPACE }}

      - name: Prepare Windows build container
        run: docker build --tag monero-gui-testnet-build-windows --build-arg THREADS=3 --file Dockerfile.windows .

      - name: Build static Windows binaries
        run: docker run --rm -e CMAKE_BUILD_PARALLEL_LEVEL=1 -v "${GITHUB_WORKSPACE}:/monero-gui" -w /monero-gui monero-gui-testnet-build-windows sh -c 'scripts/sync-testnet-monero.sh && make depends root=/depends target=x86_64-w64-mingw32 tag=win-x64 MANUAL_SUBMODULES=ON'

      - name: Verify Windows binaries
        run: |
          test -f build/x86_64-w64-mingw32/release/bin/monero-wallet-gui.exe
          test -f build/x86_64-w64-mingw32/release/bin/monerod.exe
          file build/x86_64-w64-mingw32/release/bin/monero-wallet-gui.exe

      - name: Package zip
        id: package
        run: |
          version="${GITHUB_REF_NAME:-manual}"
          if [ "${GITHUB_REF_TYPE:-}" == "tag" ]; then
            version="${version#testnet-ubuntu-v}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          zip_path="$(scripts/package-testnet-windows.sh build/x86_64-w64-mingw32/release/bin "${version}" dist)"
          echo "zip=${zip_path}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: monero-gui-testnet-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Upload zip to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Ubuntu job creates the release; this job runs in parallel and
          # may start before the release exists. Wait up to ~20 minutes.
          for i in $(seq 1 40); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              break
            fi
            echo "release ${GITHUB_REF_NAME} not ready yet, retrying in 30s ($i/40)"
            sleep 30
          done
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/*.sha256 --clobber
